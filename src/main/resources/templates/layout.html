<script th:if="${successMessage}">
    function autoDismissAlert(alertId, delay = 3000, fadeDuration = 500) {
        const alertBox = document.getElementById(alertId);
        if (alertBox) {
            setTimeout(() => {
                alertBox.style.transition = `opacity ${fadeDuration}ms ease-out`;
                alertBox.style.opacity = "0";

                setTimeout(() => {
                    alertBox.remove();
                }, fadeDuration + 100);
            }, delay);
        }
    }

    // Call the function immediately
    autoDismissAlert('loginAlert', 3000, 500);
</script>
