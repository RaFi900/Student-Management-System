<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
  <title>Instructor</title>
</head>
<body>
<div layout:fragment="content">
  <!-- Add Instructor Modal -->
  <div class="modal fade" id="addInstructorModal" tabindex="-1" aria-labelledby="addInstructorModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="custom-modal-header">
          <h5 class="modal-title" id="addInstructorModalLabel">Add New Instructor</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form id="addInstructorForm" th:action="@{/instructors}" th:object="${instructor}" method="post">
            <div class="row">
              <!-- Name -->
              <div class="col-md-6 mb-3">
                <label for="name" class="form-label">Name</label>
                <input th:field="*{name}" type="text" class="form-control" id="name" required>
              </div>

              <!-- Email -->
              <div class="col-md-6 mb-3">
                <label for="email" class="form-label">Email</label>
                <input th:field="*{email}" type="email" class="form-control" id="email" required>
              </div>

              <!-- Phone -->
              <div class="col-md-6 mb-3">
                <label for="phone" class="form-label">Phone</label>
                <input th:field="*{phone}" type="tel" class="form-control" id="phone" required>
              </div>

              <!-- Department -->
              <div class="col-md-6 mb-3">
                <label for="department" class="form-label">Department</label>
                <input th:field="*{department}" type="text" class="form-control" id="department" required>
              </div>

            </div>

            <div class="modal-footer bg-dark-2">
              <button type="button" class="btn btn-danger" data-bs-dismiss="modal">Close</button>
              <button type="submit" class="btn btn-primary" id="saveInstructor">Save</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- Data Table -->
  <div class="container" style="margin-top: 50px">
    <div class="container-fluid px-4">
      <!-- Filter -->
      <div class="row mb-3">
        <div class="col-md-4">
          <select id="instructorFilter" class="form-control" onchange="applyInstructorFilter()">
            <option value="">All Instructors</option>
            <option th:each="inst : ${instructorList}"
                    th:value="${inst.id}"
                    th:text="${inst.name}">
            </option>
          </select>
        </div>
        <div class="col-md-4"></div>
        <div class="col-md-4">
          <div class="col-auto" style="margin-left: 230px">
            <button type="button" class="btn bg-dark-2-lightest" data-bs-toggle="modal" data-bs-target="#addInstructorModal">
              <i class="fas fa-plus"></i> Add
            </button>
          </div>
        </div>
      </div>

      <!-- Update Instructor Modal -->
      <div class="modal fade" id="updateInstructorModal" tabindex="-1"
           th:classappend="${showUpdateModal} ? 'show d-block' : ''"
           th:style="${showUpdateModal} ? 'display: block;' : ''">
        <div class="modal-dialog modal-lg">
          <div class="modal-content">
            <div class="modal-header custom-modal-header">
              <h5 class="modal-title">Update Instructor</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
              <form th:action="@{/instructors/update/{id}(id=${instructor.id})}" th:object="${instructor}" method="post">
                <input type="hidden" th:field="*{id}"/>
                <div class="row">
                  <div class="col-md-6 mb-3">
                    <label>Name:</label>
                    <input type="text" th:field="*{name}" class="form-control" required>
                  </div>
                  <div class="col-md-6 mb-3">
                    <label>Email:</label>
                    <input type="email" th:field="*{email}" class="form-control" required>
                  </div>
                  <div class="col-md-6 mb-3">
                    <label>Phone:</label>
                    <input type="tel" th:field="*{phone}" class="form-control" required>
                  </div>
                  <div class="col-md-6 mb-3">
                    <label>Department:</label>
                    <input type="text" th:field="*{department}" class="form-control" required>
                  </div>
                </div>
                <div class="modal-footer">
                  <button type="button" class="btn btn-danger" data-bs-dismiss="modal">Close</button>
                  <button type="submit" class="btn btn-primary">Update</button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>

      <!-- Table -->
      <div class="card mb-4 bg-dark-2-lightest">
        <div class="card-header bg-dark-2-lightest">
          <i class="fas fa-table me-1"></i>
          Instructors
        </div>
        <div class="card-body">
          <table id="datatablesSimple" class="table table-striped">
            <thead>
            <tr>
              <th>Name</th>
              <th>Email</th>
              <th>Phone</th>
              <th>Department</th>
              <th>Action</th>
            </tr>
            </thead>
            <tfoot>
            <tr>
              <th>Name</th>
              <th>Email</th>
              <th>Phone</th>
              <th>Department</th>
              <th>Action</th>
            </tr>
            </tfoot>
            <tbody>
            <tr th:each="inst : ${instructorList}">
              <td th:text="${inst.name}">Name</td>
              <td th:text="${inst.email}">Email</td>
              <td th:text="${inst.phone}">Phone</td>
              <td th:text="${inst.department}">Department</td>
              <td>
                <a th:href="@{/instructors/edit/{id}(id=${inst.id})}" class="btn btn-primary">Edit</a>
                <form th:action="@{/delete/{id}(id=${inst.id})}" method="post" style="display:inline;">
                  <button type="submit" class="btn btn-danger" onclick="return confirm('Are you sure you want to delete this instructor?');">Delete</button>
                </form>
              </td>
            </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  document.getElementById('saveInstructor').addEventListener('click', function() {
    console.log('Save Instructor button clicked');
  });
</script>

</body>
</html>
